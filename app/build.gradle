import java.time.LocalDateTime

plugins {
	id 'com.android.application'
	id 'kotlin-android'
	id 'com.google.devtools.ksp'
	id 'kotlin-parcelize'
	id 'dagger.hilt.android.plugin'
	id 'androidx.room'
	id 'org.jetbrains.kotlin.plugin.serialization'
	id 'org.jetbrains.kotlin.plugin.compose'
	id 'io.sentry.android.gradle'
}

// Reads a credential from local.properties, falling back to an environment variable for CI.
def readSecret = { String fileKey, String envKey ->
	def props = new Properties()
	def file = rootProject.file('local.properties')
	if (file.exists()) {
		file.withInputStream { props.load(it) }
	}
	def value = (props.getProperty(fileKey) ?: System.getenv(envKey) ?: '').trim()
	while (value.length() > 1 && (value.startsWith("'") || value.startsWith('"'))
		&& value.charAt(0) == value.charAt(value.length() - 1)) {
		value = value.substring(1, value.length() - 1).trim()
	}
	return value
}

android {
	compileSdk = 37
	buildToolsVersion = '35.0.0'
	namespace = 'org.koitharu.kotatsu'

	dependenciesInfo {
		includeInApk = false
		includeInBundle = false
	}

	defaultConfig {
		applicationId 'io.github.toto.kotatsu'
		minSdk = 23
		targetSdk = 37
		versionCode = 1095
		versionName = '9.2.0'
		generatedDensities = []
		testInstrumentationRunner 'org.koitharu.kotatsu.HiltTestRunner'

		ksp {
			arg('room.generateKotlin', 'true')
		}

		androidResources {
			generateLocaleConfig false
		}

		def localProperties = new Properties()
		def localPropertiesFile = rootProject.file('local.properties')
		if (localPropertiesFile.exists()) {
			localProperties.load(new FileInputStream(localPropertiesFile))
		}

		resValue 'string', 'tg_backup_bot_token',
				localProperties.getProperty('tg_backup_bot_token', '')

		def sentryDsn = readSecret('sentry_dsn', 'SENTRY_DSN')
		buildConfigField 'String', 'SENTRY_DSN', "\"${sentryDsn}\""

		def appLinkHost = 'yomito.foo.ng'
		manifestPlaceholders = [appLinkHost: appLinkHost]
		buildConfigField 'String', 'APP_LINK_HOST', "\"${appLinkHost}\""
	}

	signingConfigs {
		release {
			def keystore = System.getenv("KEYSTORE_FILE")
			if (keystore != null) {
				storeFile file(keystore)
				storePassword System.getenv("KEYSTORE_PASSWORD")
				keyAlias System.getenv("KEY_ALIAS")
				keyPassword System.getenv("KEY_PASSWORD")
			}
		}
	}

	buildTypes {
		debug {
			applicationIdSuffix = '.debug'
		}
		release {
			minifyEnabled true
			shrinkResources true
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
			signingConfig signingConfigs.release
		}
		nightly {
			initWith release
			applicationIdSuffix = '.nightly'
			signingConfig signingConfigs.release
		}
	}

	buildFeatures {
		viewBinding true
		buildConfig true
		compose true
	}

	packagingOptions {
		resources {
			excludes += [
				'META-INF/README.md',
				'META-INF/NOTICE.md'
			]
		}
	}

	sourceSets {
		androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
		main.java.srcDirs += 'src/main/kotlin/'
	}

	compileOptions {
		coreLibraryDesugaringEnabled true
		sourceCompatibility JavaVersion.VERSION_17
		targetCompatibility JavaVersion.VERSION_17
	}

	kotlinOptions {
		jvmTarget = JavaVersion.VERSION_17.toString()
		freeCompilerArgs += [
				'-opt-in=kotlin.ExperimentalStdlibApi',
				'-opt-in=kotlinx.coroutines.ExperimentalCoroutinesApi',
				'-opt-in=kotlinx.coroutines.ExperimentalForInheritanceCoroutinesApi',
				'-opt-in=kotlinx.coroutines.InternalForInheritanceCoroutinesApi',
				'-opt-in=kotlinx.coroutines.FlowPreview',
				'-opt-in=kotlin.contracts.ExperimentalContracts',
				'-opt-in=coil3.annotation.ExperimentalCoilApi',
				'-opt-in=coil3.annotation.InternalCoilApi',
				'-opt-in=kotlinx.serialization.ExperimentalSerializationApi',
				'-Xjspecify-annotations=strict',
				'-Xannotation-default-target=first-only',
				'-Xtype-enhancement-improvements-strict-mode'
		]
	}

	room {
		schemaDirectory "$projectDir/schemas"
	}

	lint {
		abortOnError true
		disable 'MissingTranslation', 'PrivateResource', 'SetJavaScriptEnabled', 'SimpleDateFormat'
	}

	testOptions {
		unitTests.includeAndroidResources true
		unitTests.returnDefaultValues false
		kotlinOptions {
			freeCompilerArgs += ['-opt-in=org.koitharu.kotatsu.parsers.InternalParsersApi']
		}
	}

	applicationVariants.configureEach { variant ->
		if (variant.name == 'nightly') {
			variant.outputs.each { output ->
				def now = LocalDateTime.now()
				output.versionCodeOverride = now.format("yyMMdd").toInteger()
				output.versionNameOverride = 'N' + now.format("yyyyMMdd")
			}
		}
	}
}

sentry {
	def sentryOrg = readSecret('sentry_org', 'SENTRY_ORG')
	def sentryProject = readSecret('sentry_project', 'SENTRY_PROJECT')
	def sentryToken = readSecret('sentry_auth_token', 'SENTRY_AUTH_TOKEN')

	org = sentryOrg
	projectName = sentryProject
	authToken = sentryToken

	def sentryUrl = readSecret('sentry_url', 'SENTRY_URL')
	url = sentryUrl ?: 'https://de.sentry.io'

	includeProguardMapping = true
	autoUploadProguardMapping = sentryToken && sentryOrg && sentryProject
	ignoredBuildTypes = ['debug']

	autoInstallation {
		enabled = false
	}
	tracingInstrumentation {
		enabled = false
	}
	uploadNativeSymbols = false
	includeSourceContext = false
}

