name: Build Release

on:
    workflow_dispatch:
        inputs:
            type:
                description: "Tipe build"
                required: true
                default: "release"
                type: choice
                options:
                    - release
                    - nightly
            version:
                description: "Versi Stable (contoh: 9.3)"
                required: false
            description:
                description: "Deskripsi release"
                required: false
            notify_discord:
                description: "Kirim notifikasi ke Discord?"
                required: true
                type: boolean
                default: true
            notify_whatsapp:
                description: "Kirim notifikasi ke WhatsApp?"
                required: true
                type: boolean
                default: true

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-java@v4
              with:
                  java-version: "17"
                  distribution: "temurin"

            - name: Decode Keystore
              run: echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > app/release.keystore

            # 🏷️ TAG, VERSION, APK NAME & NOTIF TITLE
            - name: Set Info
              id: info
              run: |
                  if [ "${{ github.event.inputs.type }}" = "nightly" ]; then
                    DATE=$(TZ=Asia/Jakarta date +'%d%m%Y')
                    echo "tag=nightly-${DATE}" >> $GITHUB_OUTPUT
                    echo "name=Nightly ${DATE}" >> $GITHUB_OUTPUT
                    echo "version=${DATE}" >> $GITHUB_OUTPUT
                    echo "apk_name=nightly-app-release.apk" >> $GITHUB_OUTPUT
                    echo "notif_title=🌙 Yomito Beta Update Available!" >> $GITHUB_OUTPUT
                    echo "body_title=🌙 Yomito Beta Release" >> $GITHUB_OUTPUT
                    echo "target_repo=zannbjir/yomito-malam" >> $GITHUB_OUTPUT
                  else
                    VER="${{ github.event.inputs.version }}"
                    echo "tag=v${VER}" >> $GITHUB_OUTPUT
                    echo "name=Stable v${VER}" >> $GITHUB_OUTPUT
                    echo "version=v${VER}" >> $GITHUB_OUTPUT
                    echo "apk_name=stable-app-release.apk" >> $GITHUB_OUTPUT
                    echo "notif_title=🚀 Yomito Stable Update Available!" >> $GITHUB_OUTPUT
                    echo "body_title=🚀 Yomito Stable Release" >> $GITHUB_OUTPUT
                    echo "target_repo=${{ github.repository }}" >> $GITHUB_OUTPUT
                  fi

            # 📝 FORMAT CHANGELOG AUTO BULLET & CAPITALIZE
            - name: Format Changelog
              id: desc
              run: |
                  RAW="${{ github.event.inputs.description }}"
                  FORMATTED=$(echo "$RAW" | sed 's/ - /\n- /g' | sed 's/^- //g' | sed 's/^/- /' | sed 's/- \([a-z]\)/- \U\1/g')

                  echo "text<<EOF" >> $GITHUB_OUTPUT
                  echo "$FORMATTED" >> $GITHUB_OUTPUT
                  echo "EOF" >> $GITHUB_OUTPUT

                  JSON_SAFE=$(echo "$FORMATTED" | perl -pe 's/\n/\\n/g' | sed 's/\\n$//')
                  echo "json_safe=$JSON_SAFE" >> $GITHUB_OUTPUT

            # 🔨 BUILD & RENAME APK
            - name: Build & Rename APK
              run: |
                  # Bikin foldernya dulu biar gak error pas dipindah
                  mkdir -p app/build/outputs/apk/release

                  if [ "${{ github.event.inputs.type }}" = "nightly" ]; then
                    ./gradlew assembleNightly
                    # Cari file APK di folder nightly, apa pun namanya, lalu pindahkan
                    APK_PATH=$(find app/build/outputs/apk/nightly -name "*.apk" | head -n 1)
                    mv "$APK_PATH" app/build/outputs/apk/release/${{ steps.info.outputs.apk_name }}
                  else
                    ./gradlew assembleRelease
                    # Cari file APK di folder release, apa pun namanya, lalu pindahkan
                    APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
                    mv "$APK_PATH" app/build/outputs/apk/release/${{ steps.info.outputs.apk_name }}
                  fi
              env:
                  KEYSTORE_FILE: release.keystore
                  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
                  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
                  KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

            # 📏 APK SIZE + DATE
            - name: Get APK Info
              id: apk
              run: |
                  SIZE=$(du -h app/build/outputs/apk/release/${{ steps.info.outputs.apk_name }} | cut -f1)
                  DATE=$(TZ=Asia/Jakarta date +"%d %b %Y - %H:%M WIB")
                  echo "size=$SIZE" >> $GITHUB_OUTPUT
                  echo "date=$DATE" >> $GITHUB_OUTPUT

            # 📦 RELEASE BODY
            - name: Prepare Body
              run: |
                  echo "${{ steps.info.outputs.body_title }}" > BODY.md
                  echo "" >> BODY.md
                  cat <<EOF >> BODY.md
                  ${{ steps.desc.outputs.text }}
                  EOF

            # 🚀 UPLOAD GITHUB RELEASE
            - name: Upload Release
              id: release
              uses: softprops/action-gh-release@v2
              with:
                  token: ${{ secrets.MY_GITHUB_TOKEN }}
                  repository: ${{ steps.info.outputs.target_repo }}
                  tag_name: ${{ steps.info.outputs.tag }}
                  name: ${{ steps.info.outputs.name }}
                  body_path: BODY.md
                  prerelease: ${{ github.event.inputs.type == 'nightly' }}
                  files: app/build/outputs/apk/release/${{ steps.info.outputs.apk_name }}

            # 🔗 SHORTLINK MANUAL
            - name: ShortLink
              id: short
              run: |
                  SHORT="https://yomito.foo.ng/download/"
                  echo "url=$SHORT" >> $GITHUB_OUTPUT

                       # 💬 DISCORD RELEASE NOTIFICATION
                       
            - name: Discord Notify
              if: ${{ github.event.inputs.notify_discord == 'true' && success() }}
              run: |
                  if [ "${{ github.event.inputs.type }}" = "nightly" ]; then
                    MENTION=""
                    FOOTER="Nightly"
                  else
                    MENTION="<@&$DISCORD_ROLE_ID>"
                    FOOTER="Stable release"
                  fi

                  curl -X POST "$DISCORD_RELEASE_WEBHOOK" \
                    -H "Content-Type: application/json" \
                    -d @- <<EOF
                  {
                    "content": "$MENTION",
                    "embeds": [{
                      "title": "${{ steps.info.outputs.notif_title }}",
                      "url": "https://github.com/${{ steps.info.outputs.target_repo }}/releases/tag/${{ steps.info.outputs.tag }}",
                      "description": "${{ steps.desc.outputs.json_safe }}",
                      "color": 3447003,
                      "author": {
                        "name": "${{ github.actor }}",
                        "icon_url": "https://github.com/${{ github.actor }}.png"
                      },
                      "fields": [
                        {
                          "name": "📦 Versi",
                          "value": "${{ steps.info.outputs.version }}",
                          "inline": true
                        },
                        {
                          "name": "📏 Ukuran",
                          "value": "${{ steps.apk.outputs.size }}",
                          "inline": true
                        },
                        {
                          "name": "🕒 Update",
                          "value": "${{ steps.apk.outputs.date }}",
                          "inline": false
                        }
                      ],
                      "footer": {
                        "text": "$FOOTER"
                      }
                    }]
                  }
                  EOF
              env:
                  DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
                  DISCORD_ROLE_ID: ${{ secrets.DISCORD_ROLE_ID }}

            # 📲 WHATSAPP (FONNTE)
            - name: WhatsApp Notify
              if: ${{ github.event.inputs.notify_whatsapp == 'true' && success() }}
              run: |
                  MSG="*${{ steps.info.outputs.notif_title }}*\n\n📦 *Versi* : ${{ steps.info.outputs.version }}\n📏 *Ukuran* : ${{ steps.apk.outputs.size }}\n🕒 *Update* : ${{ steps.apk.outputs.date }}\n\n📝 *Changelog*:\n${{ steps.desc.outputs.json_safe }}\n\n⬇️ *Download*:\n${{ steps.short.outputs.url }}"

                  curl -X POST https://api.fonnte.com/send \
                    -H "Authorization: $FONNTE_TOKEN" \
                    -H "Content-Type: application/json" \
                    -d "{\"target\":\"$FONNTE_TARGET\",\"message\":\"$MSG\"}"
              env:
                  FONNTE_TOKEN: ${{ secrets.FONNTE_TOKEN }}
                  FONNTE_TARGET: ${{ secrets.FONNTE_TARGET }}

            # 🧹 CLEAN
            - name: Clean
              if: always()
              run: rm -f app/release.keystore
