```yaml
name: Build APK for Testing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Decode Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_FILE }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Error: KEYSTORE_FILE belum diatur!"
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          test -s app/release.keystore

      - name: Build Signed Release APK
        env:
          KEYSTORE_FILE: app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH=$(find app/build/outputs/apk/release \
            -type f -name "*.apk" ! -name "*unaligned*" \
            -print -quit)

          if [ -z "$APK_PATH" ]; then
            echo "Error: APK release tidak ditemukan!"
            exit 1
          fi

          mkdir -p dist
          cp "$APK_PATH" dist/yomito-release.apk

          echo "APK berhasil dibuat:"
          ls -lh dist/yomito-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yomito-release-apk
          path: dist/yomito-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Clean Keystore
        if: always()
        run: rm -f app/release.keystore
```
